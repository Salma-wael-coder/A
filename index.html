<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday ♥</title>

  <!-- Bootstrap + fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* ========== COLORS (your palette) ========== */
    :root {
      --c1: #cc444b;
      --c2: #da5552;
      --c3: #df7373;
      --c4: #e39695;
      --c5: #e4b1ab;
      --bg: #fff6f4;
      --text: #5a2326;
    }

    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
    .script { font-family: 'Great Vibes', cursive; }
    section { padding: 80px 0; position: relative; }

    /* ========== HERO ========== */
    #hero {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
      background: linear-gradient(160deg, var(--c1), var(--c2) 40%, var(--c3) 75%, var(--c4));
      color: #fff; overflow: hidden;
    }
    #hero h1 { font-size: clamp(3.2rem, 11vw, 7rem); text-shadow: 0 4px 20px rgba(0,0,0,.2); }
    #hero p  { font-size: 1.2rem; font-weight: 300; letter-spacing: 1px; }
    .btn-love {
      background: #fff; color: var(--c1); border: none; border-radius: 50px;
      padding: 14px 36px; font-weight: 600; box-shadow: 0 8px 25px rgba(0,0,0,.2);
      transition: transform .25s, box-shadow .25s;
    }
    .btn-love:hover { transform: translateY(-4px) scale(1.04); color: var(--c1); box-shadow: 0 14px 30px rgba(0,0,0,.25); }

    /* floating hearts */
    .heart {
      position: absolute; bottom: -40px; color: rgba(255,255,255,.55);
      animation: floatUp linear forwards; pointer-events: none; user-select: none;
    }
    @keyframes floatUp { to { transform: translateY(-115vh) rotate(25deg); opacity: 0; } }

    /* ========== SECTION TITLES ========== */
    .title { font-size: clamp(2.4rem, 6vw, 3.6rem); color: var(--c1); text-align: center; margin-bottom: 40px; }

    /* ========== MAIN PHOTO + MESSAGE ========== */
    .photo-frame {
      width: 100%; max-width: 360px; aspect-ratio: 3/4; margin: auto;
      border-radius: 180px 180px 24px 24px; overflow: hidden;
      border: 8px solid #fff; box-shadow: 0 20px 45px rgba(204,68,75,.35);
      transform: rotate(-2deg); transition: transform .4s;
    }
    .photo-frame:hover { transform: rotate(0) scale(1.03); }
    .photo-frame img { width: 100%; height: 100%; object-fit: cover; }

    .message-card {
      background: #fff; border-radius: 24px; padding: 36px; position: relative;
      box-shadow: 0 15px 40px rgba(204,68,75,.18); border-left: 8px solid var(--c3);
    }
    .message-card #message { white-space: pre-line; font-size: 1.1rem; line-height: 1.9; min-height: 160px; }
    .message-card .sign { font-size: 2.2rem; color: var(--c1); text-align: right; margin: 10px 0 0; }

    /* ========== CAKE ========== */
    #cake-section { background: linear-gradient(180deg, var(--bg), var(--c5) 140%); text-align: center; }
    .cake { width: 220px; margin: 70px auto 20px; position: relative; }
    .layer { height: 60px; border-radius: 12px; margin: 0 auto; box-shadow: inset 0 -8px 0 rgba(0,0,0,.08); }
    .layer.top { width: 140px; background: var(--c4); }
    .layer.bottom { width: 220px; background: var(--c2); }
    .layer.top::before { content: ""; display: block; height: 14px; border-radius: 12px 12px 0 0; background: #fff; }
    .candles { position: absolute; top: -50px; left: 50%; transform: translateX(-50%); display: flex; gap: 22px; }
    .candle { width: 10px; height: 38px; background: repeating-linear-gradient(45deg, #fff, #fff 6px, var(--c3) 6px, var(--c3) 12px); border-radius: 3px; position: relative; }
    .flame {
      position: absolute; top: -22px; left: -3px; width: 16px; height: 22px;
      background: radial-gradient(circle at 50% 70%, #fff3b0, #ffb347 60%, transparent 70%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      animation: flicker .25s infinite alternate; transition: opacity .5s;
    }
    .out .flame { opacity: 0; }
    @keyframes flicker { to { transform: scale(1.12, .92) rotate(4deg); } }
    #wish { opacity: 0; transition: opacity 1s; font-size: 2.2rem; color: var(--c1); margin-top: 20px; }
    #wish.show { opacity: 1; }

    /* ========== BOUQUET ========== */
    #bouquet-section { background: linear-gradient(180deg, var(--bg), #fde4e0 55%, var(--bg)); text-align: center; overflow: hidden; }
    .bouquet-wrap { max-width: 420px; margin: 0 auto; cursor: pointer; }
    .bouquet-wrap svg {
      width: 100%; height: auto; overflow: visible; transform-origin: 50% 95%;
      animation: sway 5s ease-in-out infinite; filter: drop-shadow(0 18px 18px rgba(204,68,75,.25));
    }
    @keyframes sway { 0%,100% { transform: rotate(-1.8deg); } 50% { transform: rotate(1.8deg); } }
    .flower { transform-box: fill-box; transform-origin: center; transform: scale(0) rotate(-90deg); transition: transform 1.2s cubic-bezier(.34,1.56,.64,1); }
    .reveal.visible .flower { transform: scale(1) rotate(0); }
    .stem { stroke-dasharray: 400; stroke-dashoffset: 400; transition: stroke-dashoffset 1.4s ease; }
    .reveal.visible .stem { stroke-dashoffset: 0; }
    .leaf { transform-box: fill-box; transform-origin: 0 50%; transform: scale(0); transition: transform 1s ease .8s; }
    .reveal.visible .leaf { transform: scale(1); }
    .bouquet-note { font-size: 2rem; color: var(--c1); max-width: 520px; margin: 25px auto 5px; }
    .hint { font-size: .85rem; opacity: .6; }
    .petal {
      position: fixed; top: -30px; width: 14px; height: 20px; border-radius: 80% 0 80% 0;
      z-index: 2000; pointer-events: none; animation: petalFall linear forwards;
    }
    @keyframes petalFall { to { transform: translate(var(--dx), 110vh) rotate(540deg); } }

    /* ========== SONG ========== */
    .song-box { margin: 10px auto 25px; max-width: 460px; }
    .lyric { font-size: 1.15rem; opacity: .35; transition: all .4s; margin: 4px 0; }
    .lyric.on { opacity: 1; color: var(--c1); font-weight: 600; transform: scale(1.08); }
    #cake-section .btn-love { background: var(--c1); color: #fff; }
    .btn-ghost { background: transparent; border: 2px solid var(--c1); color: var(--c1); border-radius: 50px; padding: 12px 28px; font-weight: 600; transition: .25s; }
    .btn-ghost:hover { background: var(--c1); color: #fff; }
    .pulse { animation: pulse 1s infinite; }
    @keyframes pulse { 50% { transform: scale(1.08); } }
    .singing .flame { filter: brightness(1.25); }
    .note { position: absolute; top: -40px; color: var(--c2); font-size: 1.7rem; pointer-events: none; animation: noteUp 2.6s ease-out forwards; }
    @keyframes noteUp { to { transform: translate(var(--dx), -150px) rotate(var(--rot)); opacity: 0; } }

    /* ========== GALLERY ========== */
    .gallery-item {
      position: relative; overflow: hidden; border-radius: 18px; aspect-ratio: 1/1; cursor: pointer;
      box-shadow: 0 10px 25px rgba(204,68,75,.25); transition: transform .3s;
    }
    .gallery-item:hover { transform: translateY(-8px) rotate(-1deg); }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
    .gallery-item:hover img { transform: scale(1.1); }
    .gallery-item .cap {
      position: absolute; inset: auto 0 0 0; padding: 30px 14px 12px; color: #fff; font-size: .95rem;
      background: linear-gradient(transparent, rgba(204,68,75,.85)); opacity: 0; transition: opacity .3s;
    }
    .gallery-item:hover .cap { opacity: 1; }
    .modal-content { background: transparent; border: none; }
    .modal-body img { width: 100%; border-radius: 18px; border: 6px solid #fff; }

    /* ========== FOOTER ========== */
    footer { background: var(--c1); color: #fff; text-align: center; padding: 60px 15px; }
    footer .script { font-size: 3rem; }
    .beat { display: inline-block; animation: beat 1.2s infinite; }
    @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.3); } 30% { transform: scale(1); } 45% { transform: scale(1.2); } }

    /* confetti */
    .confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 2000; animation: fall linear forwards; pointer-events: none; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

    /* scroll reveal */
    .reveal { opacity: 0; transform: translateY(40px); transition: all .9s ease; }
    .reveal.visible { opacity: 1; transform: none; }
  </style>
</head>
<body>

  <!-- ===== HERO ===== -->
  <section id="hero">
    <div class="container position-relative" style="z-index:2">
      <p>Today is all about you</p>
      <h1 class="script">Happy Birthday,<br><span id="herName"></span>!</h1>
      <p class="mb-5" id="herSubtitle"></p>
      <button class="btn btn-love btn-lg" onclick="document.getElementById('message-section').scrollIntoView({behavior:'smooth'})">
        Open your surprise ♥
      </button>
    </div>
  </section>

  <!-- ===== PHOTO + MESSAGE ===== -->
  <section id="message-section">
    <div class="container">
      <h2 class="title script reveal">A little something for you</h2>
      <div class="row align-items-center g-5">
        <div class="col-md-5 reveal">
          <div class="photo-frame"><img id="mainPhoto" src="WhatsApp Image 2026-11-05 at 12.16.30 AM.jpeg" alt="Us"></div>
        </div>
        <div class="col-md-7 reveal">
          <div class="message-card">
            <div id="message"></div>
            <p class="sign script" id="signature"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== BOUQUET ===== -->
  <section id="bouquet-section">
    <div class="container">
      <h2 class="title script reveal">Flowers for you</h2>
      <div class="bouquet-wrap reveal" id="bouquet" title="Tap me!">
        <svg id="bouquetSvg" viewBox="0 0 400 490" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <p class="bouquet-note script" id="bouquetText"></p>
      <p class="hint">Tap the bouquet 🌸</p>
    </div>
  </section>

  <!-- ===== CAKE ===== -->
  <section id="cake-section">
    <div class="container">
      <h2 class="title script reveal">Make a wish</h2>
      <div class="cake reveal" id="cake">
        <div class="candles">
          <div class="candle"><div class="flame"></div></div>
          <div class="candle"><div class="flame"></div></div>
          <div class="candle"><div class="flame"></div></div>
        </div>
        <div class="layer top"></div>
        <div class="layer bottom"></div>
      </div>
      <div class="song-box">
        <div class="lyric">Happy birthday to you</div>
        <div class="lyric">Happy birthday to you</div>
        <div class="lyric" id="lyric3"></div>
        <div class="lyric">Happy birthday to you</div>
      </div>
      <div class="d-flex flex-wrap gap-3 justify-content-center">
        <button class="btn btn-ghost" id="songBtn">Play the birthday song 🎶</button>
        <button class="btn btn-love" id="blowBtn">Blow out the candles 🕯️</button>
      </div>
      <div id="wish" class="script">May every wish come true ♥</div>
    </div>
  </section>

  <!-- ===== GALLERY ===== -->
  <section id="gallery-section">
    <div class="container">
      <h2 class="title script reveal">Our moments</h2>
      <div class="row g-4" id="gallery"></div>
    </div>
  </section>

  <!-- Photo popup -->
  <div class="modal fade" id="photoModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content" data-bs-dismiss="modal">
        <div class="modal-body p-0"><img id="modalImg" alt=""></div>
      </div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="script" id="footerText"></div>
    <div class="fs-1 mt-2"><span class="beat">❤</span></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    /* =====================================================
       ✏️  EDIT HERE — everything you need to change
       ===================================================== */
    const CONFIG = {
      name: "My Love",                       // her name
      subtitle: "Another year of you, another reason to celebrate",

      // Put your photos in a folder called "photos" next to this file
      mainPhoto: "photos/main.jpeg",

      // Your message (use a new line for a new paragraph)
      message:
        "Habibi,\n\n" +
        "Alles Gute zum Geburtstag, mein Schatz, mein Leben, mein Alles.: you.\n\n" +
        "TMöge Gott dich mir erhalten! Bleib immer an meiner Seite – lass uns für immer zusammenbleiben. Mögest du all deine Wünsche verwirklichen, und ich hoffe, dass ich dich immer als den erfolgreichsten Menschen auf der ganzen Welt sehen darf. " +
        "Ich liebe dich, ich bin verrückt nach dir und habe niemanden außer dir.\n\n" +
        "Ich vermisse dich so sehr!, Ahmed",
      signature: "Forever yours, ♥",

      // Our pictures: add / remove lines freely
      gallery: [
        { src: "photos/1.jpeg", caption: "The day we met" },
        { src: "photos/2.jpeg", caption: "Our engagement" },
        { src: "photos/3.jpeg", caption: "Laughing together" },
        { src: "photos/4.jpeg", caption: "My favourite person" },
        { src: "photos/5.jpeg", caption: "Sw  eet memories" },
        { src: "photos/6.jpeg", caption: "My Birthday" },
        { src: "photos/7.jpeg", caption: "Always us" },
        { src: "photos/8.jpeg", caption: "Always us" },
         { src: "photos/9.jpeg", caption: "My favourite person" },
      ],

      footerText: "I love you more every day",

      // Text under the bouquet
      bouquetText: "These flowers may fade, but my love for you never will.",

      // Birthday song: leave "" to use the built-in melody,
      // or put your own audio file next to this page, e.g. "song.mp3"
      songFile: ""
    };

    /* =====================================================
       Code below — you don't need to change it
       ===================================================== */
    const COLORS = ["#cc444b", "#da5552", "#df7373", "#e39695", "#e4b1ab"];

    // Placeholder shown when a photo file is missing
    const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
      `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'>
         <rect width='400' height='400' fill='#e4b1ab'/>
         <text x='200' y='230' font-size='120' text-anchor='middle' fill='#fff'>♥</text>
       </svg>`);
    const safeImg = (img) => { img.onerror = () => { img.onerror = null; img.src = PLACEHOLDER; }; };

    // Fill in texts and photos
    document.getElementById("herName").textContent = CONFIG.name;
    document.getElementById("herSubtitle").textContent = CONFIG.subtitle;
    document.getElementById("signature").textContent = CONFIG.signature;
    document.getElementById("footerText").textContent = CONFIG.footerText;

    const main = document.getElementById("mainPhoto");
    safeImg(main); main.src = CONFIG.mainPhoto;

    const gallery = document.getElementById("gallery");
    CONFIG.gallery.forEach((p) => {
      const col = document.createElement("div");
      col.className = "col-6 col-md-4 reveal";
      col.innerHTML = `<div class="gallery-item"><img alt="${p.caption}"><div class="cap">${p.caption}</div></div>`;
      const img = col.querySelector("img");
      safeImg(img); img.src = p.src;
      col.addEventListener("click", () => {
        document.getElementById("modalImg").src = img.src;
        new bootstrap.Modal("#photoModal").show();
      });
      gallery.appendChild(col);
    });

    // Floating hearts in the hero
    function spawnHeart() {
      const h = document.createElement("span");
      h.className = "heart";
      h.textContent = Math.random() > .3 ? "❤" : "♥";
      h.style.left = Math.random() * 100 + "%";
      h.style.fontSize = 14 + Math.random() * 30 + "px";
      h.style.animationDuration = 6 + Math.random() * 6 + "s";
      document.getElementById("hero").appendChild(h);
      setTimeout(() => h.remove(), 12000);
    }
    setInterval(spawnHeart, 400);

    // Typewriter message (starts when it scrolls into view)
    const msgEl = document.getElementById("message");
    let typed = false;
    function typeMessage() {
      if (typed) return; typed = true;
      let i = 0;
      const t = setInterval(() => {
        msgEl.textContent = CONFIG.message.slice(0, ++i);
        if (i >= CONFIG.message.length) clearInterval(t);
      }, 35);
    }

    // Scroll reveal
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.add("visible");
          if (e.target.querySelector("#message")) typeMessage();
        }
      });
    }, { threshold: .25 });
    document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

    // Confetti
    function confetti(n = 120) {
      for (let i = 0; i < n; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
        c.style.animationDuration = 2 + Math.random() * 3 + "s";
        c.style.animationDelay = Math.random() * .8 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 6500);
      }
    }

    /* ===== Bouquet (drawn with SVG) ===== */
    document.getElementById("bouquetText").textContent = CONFIG.bouquetText;

    // x, y, size, color — drawn back to front. Change colors or move flowers here.
    const FLOWERS = [
      [70, 235, 36, "#e39695"], [330, 235, 36, "#e4b1ab"],
      [120, 150, 42, "#df7373"], [280, 150, 42, "#da5552"],
      [200, 100, 50, "#cc444b"],
      [160, 215, 40, "#da5552"], [240, 215, 40, "#cc444b"],
    ];
    const LEAVES = [[185, 330, -155], [215, 330, -25], [182, 290, -178], [218, 290, -2]]; // x, y, angle
    const SPRIGS = [[40, 170], [360, 170], [100, 60], [300, 60], [200, 28]];             // baby's-breath

    function flowerSVG(x, y, r, color, i) {
      let petals = "", inner = "";
      for (let k = 0; k < 8; k++) {
        petals += `<ellipse cy="${-r * .55}" rx="${r * .32}" ry="${r * .5}" fill="${color}" stroke="#fff" stroke-opacity=".3" transform="rotate(${k * 45})"/>`;
        inner  += `<ellipse cy="${-r * .32}" rx="${r * .2}" ry="${r * .32}" fill="#fff" fill-opacity=".3" transform="rotate(${k * 45 + 22.5})"/>`;
      }
      return `<g transform="translate(${x} ${y})"><g class="flower" style="transition-delay:${.6 + i * .18}s">
        ${petals}${inner}<circle r="${r * .2}" fill="#ffe3a3" stroke="#fff" stroke-width="2"/></g></g>`;
    }

    let bq = "";
    SPRIGS.forEach(([x, y]) => {
      bq += `<path d="M200 360 Q ${(200 + x) / 2} ${(360 + y) / 2} ${x} ${y}" stroke="#8fb287" stroke-width="2.5" fill="none"/>`;
      [[0, 0, 7], [-8, 6, 4.5], [8, 7, 4.5]].forEach(([dx, dy, rr]) =>
        bq += `<circle cx="${x + dx}" cy="${y + dy}" r="${rr}" fill="#fff" stroke="#e4b1ab"/>`);
    });
    FLOWERS.forEach(([x, y], i) => {
      bq += `<path class="stem" style="transition-delay:${i * .12}s" d="M200 360 Q ${(200 + x) / 2} ${(360 + y) / 2 + 30} ${x} ${y}" stroke="#6f9a6a" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    });
    LEAVES.forEach(([x, y, a], i) => {
      bq += `<g transform="translate(${x} ${y}) rotate(${a})"><path class="leaf" fill="${i % 2 ? "#8fb287" : "#6f9a6a"}" d="M0 0 C20 -26 50 -26 72 0 C50 22 20 22 0 0Z"/></g>`;
    });
    FLOWERS.forEach(([x, y, r, c], i) => bq += flowerSVG(x, y, r, c, i));
    bq += `
      <path d="M90 300 L310 300 L250 468 Q200 485 150 468Z" fill="#e4b1ab"/>
      <path d="M115 340 L285 340 L245 470 Q200 482 155 470Z" fill="#e39695"/>
      <path d="M115 340 L200 472 L155 470Z" fill="#df7373" fill-opacity=".45"/>
      <path d="M128 392 L272 392 L266 410 L134 410Z" fill="#cc444b"/>
      <path d="M200 401 C150 360 140 415 200 401Z M200 401 C250 360 260 415 200 401Z" fill="#cc444b"/>
      <path d="M196 408 L178 448 L196 440Z M204 408 L222 448 L204 440Z" fill="#cc444b"/>
      <circle cx="200" cy="401" r="9" fill="#da5552"/>`;
    document.getElementById("bouquetSvg").innerHTML = bq;

    // Falling petals (tap the bouquet, or automatically when it appears)
    function petalRain(n = 60) {
      for (let i = 0; i < n; i++) {
        const p = document.createElement("div");
        p.className = "petal";
        p.style.left = Math.random() * 100 + "vw";
        p.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
        p.style.setProperty("--dx", Math.random() * 200 - 100 + "px");
        p.style.animationDuration = 3 + Math.random() * 4 + "s";
        p.style.animationDelay = Math.random() * 1 + "s";
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 8500);
      }
    }
    document.getElementById("bouquet").addEventListener("click", () => petalRain());
    new IntersectionObserver((es, ob) => {
      if (es[0].isIntersecting) { setTimeout(() => petalRain(35), 1800); ob.disconnect(); }
    }, { threshold: .5 }).observe(document.getElementById("bouquet"));

    /* ===== Birthday song (built-in melody, or your own file) ===== */
    const NOTE = { G4: 392, A4: 440, B4: 494, C5: 523, D5: 587, E5: 659, F5: 698, G5: 784 };
    const SONG = [   // each line: [note, length in beats]
      [["G4", .75], ["G4", .25], ["A4", 1], ["G4", 1], ["C5", 1], ["B4", 2]],
      [["G4", .75], ["G4", .25], ["A4", 1], ["G4", 1], ["D5", 1], ["C5", 2]],
      [["G4", .75], ["G4", .25], ["G5", 1], ["E5", 1], ["C5", 1], ["B4", 1], ["A4", 2]],
      [["F5", .75], ["F5", .25], ["E5", 1], ["C5", 1], ["D5", 1], ["C5", 2]],
    ];
    const BEAT = 0.6;   // seconds per beat — make it smaller for a faster song
    const lyrics = document.querySelectorAll(".lyric");
    document.getElementById("lyric3").textContent = "Happy birthday dear " + CONFIG.name;
    const songBtn = document.getElementById("songBtn");
    let audioCtx, master, singTimers = [], singing = false, customAudio;

    function tone(freq, start, dur) {            // soft music-box style note
      [[1, .5], [2, .12]].forEach(([mult, vol]) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "sine"; o.frequency.value = freq * mult;
        g.gain.setValueAtTime(0, start);
        g.gain.linearRampToValueAtTime(vol, start + .03);
        g.gain.exponentialRampToValueAtTime(.001, start + dur);
        o.connect(g); g.connect(master); o.start(start); o.stop(start + dur + .05);
      });
    }
    function floatNote() {
      const n = document.createElement("span");
      n.className = "note";
      n.textContent = Math.random() > .5 ? "♪" : "♫";
      n.style.left = 30 + Math.random() * 40 + "%";
      n.style.setProperty("--dx", Math.random() * 160 - 80 + "px");
      n.style.setProperty("--rot", Math.random() * 60 - 30 + "deg");
      document.getElementById("cake").appendChild(n);
      setTimeout(() => n.remove(), 2700);
    }
    function startSong() {
      stopSong();
      singing = true;
      document.getElementById("cake").classList.add("singing");
      songBtn.textContent = "Stop ⏹";
      if (CONFIG.songFile) {
        customAudio = new Audio(CONFIG.songFile);
        customAudio.onended = endSong;
        customAudio.play().catch(() => alert("Couldn't play the song file — check songFile in CONFIG."));
        lyrics.forEach((l) => l.classList.add("on"));
        return;
      }
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      master = audioCtx.createGain(); master.gain.value = .8; master.connect(audioCtx.destination);
      let t = audioCtx.currentTime + .2;
      SONG.forEach((line, li) => {
        singTimers.push(setTimeout(() => lyrics.forEach((l, i) => l.classList.toggle("on", i === li)), (t - audioCtx.currentTime) * 1000));
        line.forEach(([n, beats]) => {
          const d = beats * BEAT;
          tone(NOTE[n], t, d * .95 + .15);
          singTimers.push(setTimeout(floatNote, (t - audioCtx.currentTime) * 1000));
          t += d;
        });
      });
      singTimers.push(setTimeout(endSong, (t - audioCtx.currentTime) * 1000 + 600));
    }
    function stopSong() {
      singTimers.forEach(clearTimeout); singTimers = [];
      if (master) { master.disconnect(); master = null; }
      if (customAudio) { customAudio.pause(); customAudio = null; }
      singing = false;
      lyrics.forEach((l) => l.classList.remove("on"));
      document.getElementById("cake").classList.remove("singing");
      songBtn.textContent = "Play the birthday song 🎶";
    }
    function endSong() {                           // song finished → invite her to blow the candles
      stopSong();
      document.getElementById("blowBtn").classList.add("pulse");
    }
    songBtn.addEventListener("click", () => singing ? stopSong() : startSong());

    // Blow out candles
    document.getElementById("blowBtn").addEventListener("click", () => {
      stopSong();
      document.getElementById("blowBtn").classList.remove("pulse");
      document.getElementById("cake").classList.add("out");
      document.getElementById("wish").classList.add("show");
      confetti();
    });
  </script>
</body>
</html>
